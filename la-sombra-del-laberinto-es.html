<script>
"use strict";
const scenes={
intro:{type:"intro",title:"La sombra del laberinto",tag:"UNA AVENTURA PARA VALIENTES CURIOSOS",subtitle:"Un videojuego antiguo. Una ventana sin cortinas. Y algo que no debería estar en la pared.",paragraphs:["Esta noche, tú decides qué hace Alex. Cada elección cambia la historia. Lee con atención: algunas pistas son pequeñas, pero pueden llevarte a un final secreto.","No hay decisiones incorrectas. Si llegas a un final, puedes volver y descubrir otro camino."],options:[{label:"Entrar en la aventura",to:"habitacion"}],art:"cover"},
habitacion:{n:1,title:"Una partida más",paragraphs:["La habitación del escritorio es pequeña. Tiene una computadora, una estantería y una ventana sin cortinas. Desde allí se ven los faroles de la calle.","Esta noche mamá ha salido un momento y una persona de confianza está en la casa de al lado. Alex conoce las reglas: puede jugar un rato, pero no debe abrir la puerta a desconocidos.","El juego favorito de Alex es Pac-Man. El pequeño personaje amarillo corre por un laberinto azul, recoge puntos y escapa de los fantasmas.","La luz del escritorio está apagada. En la pared se dibuja la sombra de su cabeza. Entonces, justo cuando Pac-Man pierde una vida, **algo se mueve detrás de esa sombra**."],question:"¿Qué debería hacer Alex?",options:[{label:"Mirar la sombra sin darse la vuelta",to:"sombra"},{label:"Encender la lámpara del escritorio",to:"lampara"}],art:"game"},
sombra:{n:2,title:"Cinco dedos demasiado largos",paragraphs:["Alex contiene la respiración. Al lado de la sombra de su cabeza aparece otra: cinco dedos largos y curvados, como una garra de dibujo animado.","Alex mueve despacio una mano. Su sombra se mueve también... pero **los cinco dedos extraños se quedan quietos**.","En el juego comienza a sonar la música de una nueva partida. La figura parece acercarse un poquito a la silla."],question:"¿Cómo reaccionas?",options:[{label:"Llamar en voz alta a mamá, aunque no esté",to:"voz"},{label:"Seguir jugando para observar qué ocurre",to:"partida"},{label:"Girar la silla y mirar detrás",to:"giro"}],art:"shadow"},
lampara:{n:2,title:"¡Clic!",paragraphs:["Alex pulsa el interruptor. La lámpara ilumina la mesa... y la sombra desaparece.","Pero algo ha cambiado: en el cristal de la ventana hay una **pequeña marca azul**, como si alguien hubiera apoyado allí una cinta.","El aire mueve una hoja del escritorio. La ventana, que antes estaba cerrada, ahora está apenas entreabierta."],question:"¿Qué pista investigas primero?",options:[{label:"Observar la marca azul desde dentro",to:"marca"},{label:"Ir al pasillo iluminado y pedir ayuda",to:"pasillo"}],art:"window"},
voz:{n:3,title:"Una voz en el pasillo",paragraphs:["—¡Mamá! ¿Hay algo para comer? —grita Alex, tratando de sonar tranquilo.","Aunque sabe que mamá no ha vuelto, el truco parece funcionar. La garra retrocede un poquito. Alex escucha un ruido suave: **tic, tic**, cerca de la ventana.","En la pantalla, Pac-Man vuelve al inicio del laberinto. La sombra espera."],question:"¿Qué eliges?",options:[{label:"Salir al pasillo donde hay luz",to:"pasillo"},{label:"Prestar atención al ruido de la ventana",to:"ventana"}],art:"shadow"},
partida:{n:3,title:"El fantasma no juega solo",paragraphs:["Alex inicia otra partida. Cuando Pac-Man dobla a la izquierda, la sombra de la garra se estira hacia la izquierda. Cuando gira a la derecha, la sombra también cambia.","¿Será una coincidencia? Alex prueba detener el juego. La mano queda inmóvil.","Entonces nota algo más: junto a la ventana, una **cinta azul se balancea** al ritmo del viento."],question:"¿Qué pista es más importante?",options:[{label:"La cinta azul junto a la ventana",to:"marca"},{label:"El movimiento de la sombra con el juego",to:"codigo"}],art:"maze"},
giro:{n:3,title:"Detrás de la silla",paragraphs:["Alex cuenta: uno, dos, tres... ¡y se da la vuelta!", "No hay monstruo. Solo la estantería, una planta pequeña y una ventana que deja pasar el aire.","Pero cuando mira otra vez la pared, los dedos alargados continúan allí. Eso es imposible: **la sombra no corresponde a ningún objeto que Alex pueda ver**."],question:"¿Qué harías ahora?",options:[{label:"Seguir la dirección de la luz del farol",to:"ventana"},{label:"Salir y buscar a un adulto de confianza",to:"pasillo"}],art:"room"},
marca:{n:4,title:"El secreto del cristal",paragraphs:["Sin acercarse demasiado, Alex observa la ventana desde el escritorio. La marca azul no está pintada: es el reflejo de una cinta atada a una figura de papel, al otro lado del vidrio.","La figura parece una mano de dedos largos. El viento la hace girar y el farol proyecta su silueta sobre la pared.","¡Eso explicaría la garra! Pero queda una pregunta: **¿quién puso allí esa figura?**"],question:"¿Qué pista sigues?",options:[{label:"Examinar el dibujo que aparece en la cinta",to:"mensaje"},{label:"Pedir ayuda para revisar la ventana con seguridad",to:"pasillo"}],art:"window"},
ventana:{n:4,title:"Tic, tic, tic",paragraphs:["Alex se acerca solo hasta donde puede ver el cristal, sin abrirlo. Afuera algo golpea suavemente la ventana.","No parece una garra viva. Es una **figura recortada de cartón**, sujeta a una cinta azul. La luz del farol proyecta la forma de sus dedos sobre la pared.","En una esquina del cartón hay dibujado un pequeño laberinto, parecido al del videojuego."],question:"¿Qué decides?",options:[{label:"Buscar qué significa el pequeño laberinto",to:"codigo"},{label:"Llamar a una persona adulta y contarle todo",to:"pasillo"}],art:"window"},
codigo:{n:5,title:"El laberinto dibujado",paragraphs:["Alex observa el papel pegado al cristal. Tiene cuatro flechas: arriba, derecha, abajo, izquierda. Y debajo aparece una frase: **«No todas las sombras quieren asustar»**.","Las flechas son los movimientos que Alex hizo durante la última partida. Al repetirlos con la mirada, descubre una palabra escondida entre los caminos: **LIBRO**.","Alex recuerda un libro de acertijos que mamá guarda en la estantería."],question:"¿Cuál será el siguiente paso?",options:[{label:"Buscar el libro de acertijos",to:"libro"},{label:"Dejar el misterio y esperar acompañado",to:"espera"}],art:"maze"},
mensaje:{n:5,title:"Una nota para detectives",paragraphs:["En la cinta hay dibujadas cuatro flechas. Alex las sigue con el dedo en el aire y descubre unas letras diminutas: **L-I-B-R-O**.","La figura de cartón sigue meciéndose afuera. Parece mucho menos aterradora cuando se sabe qué es.","En la estantería está el libro de acertijos que mamá suele leer con Alex."],question:"¿Cómo continúa la aventura?",options:[{label:"Buscar el libro de acertijos",to:"libro"},{label:"Esperar a mamá y enseñarle la pista",to:"espera"}],art:"clue"},
pasillo:{n:4,title:"La puerta abierta",paragraphs:["Alex sale al pasillo iluminado y llama por teléfono a mamá. Ella responde enseguida y le pide que se quede en la sala mientras avisa a la vecina de confianza.","Poco después llega la vecina. Juntos observan desde un lugar seguro la ventana: una figura de cartón con dedos larguísimos se mueve por el viento.","—Las sombras parecen enormes cuando no sabemos de dónde vienen —dice la vecina. Pero ¿por qué hay un laberinto dibujado en la figura?"],question:"¿Qué hace Alex?",options:[{label:"Resolver el dibujo con ayuda",to:"codigo"},{label:"Guardar la sorpresa para cuando vuelva mamá",to:"espera"}],art:"hall"},
libro:{n:6,title:"La página que faltaba",paragraphs:["Alex abre el libro de acertijos. Entre dos páginas encuentra una nota escrita por mamá: **«Para mi gran explorador: mira detrás de la portada»**.","Detrás de la cubierta hay un pequeño sobre con una estrella amarilla. Dentro aparece un mensaje: «Los mejores misterios se resuelven con ojos atentos, preguntas y un poquito de valor».","Junto al mensaje hay una foto de Alex y mamá construyendo sombras con cartón. ¡Alex había olvidado aquella tarde!"],question:"¿Cómo termina tu aventura?",options:[{label:"Abrir la última pista del sobre",to:"final_sorpresa"},{label:"Volver a observar el laberinto del videojuego",to:"final_pixel"}],art:"book"},
espera:{n:6,title:"Cuando mamá regresó",paragraphs:["Mamá vuelve a casa. Alex le muestra la figura de cartón que se balancea fuera de la ventana y cuenta cada detalle, desde la primera sombra hasta las misteriosas flechas.","Mamá escucha con atención. Después sonríe y señala una caja de materiales para hacer manualidades. Dentro faltan un pedazo de cartón... y una cinta azul.","—Creo que dejamos nuestra sorpresa demasiado cerca de la ventana —admite. Habían preparado un juego de sombras el fin de semana pasado."],question:"¿Quieres descubrir lo último que ocurrió?",options:[{label:"Ver el final de la historia",to:"final_sombra"}],art:"hall"},
final_sorpresa:{type:"ending",ending:1,title:"Final 1: El club secreto",paragraphs:["Dentro del sobre hay una tarjeta: **«Invitación oficial al Club de los Misterios»**.","Mamá había preparado una búsqueda del tesoro con pistas de papel y sombras. Una ráfaga de viento soltó una de las figuras y la hizo bailar frente a la ventana.","Cuando mamá regresa, Alex le cuenta cómo siguió las pistas. Los dos se ríen y deciden inventar una nueva aventura... esta vez antes de que anochezca.","Alex guarda la tarjeta en el libro. Mañana habrá otro misterio. Y para resolverlo, tendrá que **seguir leyendo**."],art:"book",note:"Pista de detective: observar antes de imaginar lo peor puede cambiar una historia."},
final_pixel:{type:"ending",ending:2,title:"Final 2: El último píxel",paragraphs:["Alex vuelve a mirar la pantalla. La partida de Pac-Man está en pausa. En el laberinto azul hay un camino con la misma forma de las flechas de la cinta.","Alex mueve el personaje siguiendo la secuencia. ¡Aparece un pequeño mensaje oculto en el juego que había preparado con mamá días atrás!: **«MISTERIO RESUELTO»**.","Cuando mamá vuelve, explica que habían creado aquel nivel especial juntos, pero Alex ya no lo recordaba. La figura de cartón había convertido el juego en una aventura inesperada.","Alex apaga la computadora, enciende la lámpara y anota una idea en su cuaderno: **«Mañana inventaré mi propio laberinto»**."],art:"maze",note:"Pista de detective: releer y conectar detalles ayuda a encontrar caminos nuevos."},
final_sombra:{type:"ending",ending:3,title:"Final 3: La sombra amistosa",paragraphs:["Mamá recoge la figura de cartón cuando es seguro hacerlo. La coloca frente a una linterna: cinco dedos largos aparecen otra vez sobre la pared.","Alex se ríe. La garra que parecía tan terrible no era más que un dibujo de papel y luz.","Esa noche preparan un teatro de sombras. Crean un zorro, una montaña y hasta un fantasma diminuto.","Antes de dormir, Alex escribe el título de su nuevo cuento: **«La sombra que quería contar una historia»**."],art:"shadow",note:"Pista de detective: la luz puede cambiar lo que creemos estar viendo."},
final_misterio:{type:"ending",ending:4,title:"Final 4: La última sombra",paragraphs:["Alex decide guardar el papel con el laberinto. Al día siguiente, con mamá al lado, coloca la figura frente a la luz y reproduce el movimiento de la garra.","Todo parece explicado. Sin embargo, al abrir el libro de acertijos, encuentra una página que no recuerda haber visto: **«El siguiente misterio empieza cuando alguien se atreve a leerlo»**.","Alex sonríe. Tal vez mamá ha preparado otra sorpresa. O tal vez los misterios siempre dejan una puerta entreabierta.","Toma un lápiz y escribe: **«Capítulo uno...»**"],art:"clue",note:"Pista de detective: a veces un final es el principio de otra historia."}
};
// Un cuarto final se descubre tomando una ruta alternativa después de resolver pistas.
scenes.libro.options.push({label:"Guardar el sobre y escribir tu propia teoría",to:"final_misterio"});

let path=["intro"],found=[];
try{const a=JSON.parse(localStorage.getItem("club-sombra-v1")||"null");if(a&&Array.isArray(a.path)&&a.path.every(id=>scenes[id])&&Array.isArray(a.found)){path=a.path;found=a.found.filter(n=>Number.isInteger(n)&&n>=1&&n<=4)}}catch(e){}

const paper=`<path d="M626 115l18-34l17 34l16-18l10 35l-30 30Z" fill="#f7dca2" stroke="#ca9e6e" stroke-width="4"/><path d="M657 163l-9 37" stroke="#70c9e0" stroke-width="7"/>`;

return `<svg viewBox="0 0 850 350" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152651"/><stop offset="1" stop-color="#544c92"/></linearGradient><radialGradient id="light"><stop stop-color="#ffe4a7" stop-opacity=".7"/><stop offset="1" stop-color="#ffe4a7" stop-opacity="0"/></radialGradient></defs><rect width="850" height="350" fill="url(#bg)"/><circle cx="650" cy="133" r="200" fill="url(#light)"/><path d="M0 311h850v39H0Z" fill="#142643"/><path d="M780 0v350M0 0v350" stroke="#7c80c2" stroke-opacity=".25" stroke-width="6"/>${windowShape}${desk}${extra}<g fill="#ffe7a4"><path d="M80 65l5 13l13 5l-13 5l-5 13l-5-13l-13-5l13-5Z"/><path d="M760 48l4 9l9 4l-9 4l-4 9l-4-9l-9-4l9-4Z"/><circle cx="422" cy="51" r="4"/></g><path d="M0 340q180-35 355 0t495 0" fill="none" stroke="#5fd5d0" stroke-opacity=".3" stroke-width="7"/></svg>`}
const illustrations={
  'cover':'Imagens/portada-sombra.png.png',
  'game':'Imagens/sebas-jugando.png.png',
  'maze':'Imagens/sebas-jugando.png.png',
  'shadow':'Imagens/sebas-sombra.png.png',
  'room':'Imagens/sebas-sombra.png.png',
  'hall':'Imagens/sebas-escapando.png.png',
  'window':'Imagens/sebas-mama.png.png',
  'clue':'Imagens/sebas-mama.png.png',
  'book':'Imagens/sebas-mama.png.png'
};
function sceneIllustration(kind){const src=illustrations[kind]||illustrations.cover;return `<img class="scene-illustration ${kind==='cover'?'cover-art':''}" src="${src}" alt="${kind==='cover'?'Illustrated mystery story cover':'Illustrated scene from the mystery story'}" onerror="this.outerHTML=artwork('${kind}')">`;}
function go(id){if(!scenes[id])return;path.push(id);const s=scenes[id];if(s.ending&&!found.includes(s.ending))found.push(s.ending);persist();render();window.scrollTo({top:0,behavior:"instant"})}
function render(){const id=path[path.length-1],s=scenes[id];$("art").innerHTML=sceneIllustration(s.art||"cover");$("tag").textContent=s.type==="intro"?s.tag:s.type==="ending"?"MISTERIO RESUELTO · FINAL "+s.ending:"CAPÍTULO "+s.n;$("title").textContent=s.title;$("title").tagName;$("subtitle").textContent=s.subtitle||"";$("subtitle").classList.toggle("hidden",!s.subtitle);$("story").innerHTML=s.paragraphs.map(p=>`<p>${safeText(p)}</p>`).join("");$("prompt").textContent=s.question||"";$("prompt").classList.toggle("hidden",!s.question);$("choices").innerHTML="";
(s.options||[]).forEach((o,i)=>{let b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`<span class="num">${i+1}</span><span>${safeText(o.label)}</span><span class="arrow" aria-hidden="true">→</span>`;b.addEventListener("click",()=>go(o.to));$("choices").appendChild(b)});
$("end-extra").innerHTML=s.type==="ending"?`<div class="note">${safeText(s.note)}</div><div class="collection"><strong>Tu colección de finales: ${found.length} de 4</strong><div class="ending-grid">${[1,2,3,4].map(n=>`<span class="token ${found.includes(n)?'':'lock'}">${found.includes(n)?'✦ Final '+n:'🔒 Final '+n}</span>`).join('')}</div><div class="hint">¿Puedes descubrir todos los finales? Vuelve a las decisiones y prueba otro camino.</div></div>`:"";
$("actions").innerHTML="";if(s.type==="ending"){addAction("↻ Explorar otro camino",()=>{path=["intro"];persist();render()},false);addAction("← Volver a elegir",back,true)}
$("back").hidden=path.length<=1;$("progress").classList.toggle("hidden",s.type==="intro");$("chapter").textContent=s.type==="ending"?"¡Llegaste a un final!":"Capítulo "+(s.n||1);$("progress-text").textContent=s.type==="ending"?`${found.length} de 4 finales descubiertos`:"Sigue las pistas";$("progress-fill").style.width=(s.type==="ending"?100:Math.min(94,(s.n||1)/6*100))+"%"}
function addAction(label,fn,secondary){let b=document.createElement("button");b.type="button";b.className="action"+(secondary?" secondary":"");b.textContent=label;b.addEventListener("click",fn);$("actions").appendChild(b)}
function back(){if(path.length>1){path.pop();persist();render();window.scrollTo({top:0,behavior:"instant"})}}
$("back").addEventListener("click",back);$("home").addEventListener("click",()=>{path=["intro"];persist();render();window.scrollTo({top:0,behavior:"instant"})});$("restart").addEventListener("click",()=>{if(confirm("¿Volver al principio? Mantendrás los finales que ya descubriste.")){path=["intro"];persist();render();window.scrollTo({top:0,behavior:"instant"})}});
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement?.tagName))return;if(!/^[1-3]$/.test(e.key))return;const b=$("choices").children[Number(e.key)-1];if(b)b.click()});render();
</script>
