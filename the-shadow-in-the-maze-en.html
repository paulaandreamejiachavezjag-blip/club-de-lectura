return `<svg viewBox="0 0 850 350" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152651"/><stop offset="1" stop-color="#544c92"/></linearGradient><radialGradient id="light"><stop stop-color="#ffe4a7" stop-opacity=".7"/><stop offset="1" stop-color="#ffe4a7" stop-opacity="0"/></radialGradient></defs><rect width="850" height="350" fill="url(#bg)"/><circle cx="650" cy="133" r="200" fill="url(#light)"/><path d="M0 311h850v39H0Z" fill="#142643"/><path d="M780 0v350M0 0v350" stroke="#7c80c2" stroke-opacity=".25" stroke-width="6"/>${windowShape}${desk}${extra}<g fill="#ffe7a4"><path d="M80 65l5 13l13 5l-13 5l-5 13l-5-13l-13-5l13-5Z"/><path d="M760 48l4 9l9 4l-9 4l-4 9l-4-9l-9-4l9-4Z"/><circle cx="422" cy="51" r="4"/></g><path d="M0 340q180-35 355 0t495 0" fill="none" stroke="#5fd5d0" stroke-opacity=".3" stroke-width="7"/></svg>`}
const illustrations={
  'cover':'Imagens/portada-sombra.png.png',
  'game':'Imagens/sebas-jugando.png.png',
  'maze':'Imagens/sebas-jugando.png.png',
  'shadow':'Imagens/sebas-sombra.png.png',
  'room':'Imagens/sebas-sombra.png.png',
  'hall':'Imagens/sebas-escapando.png.png',
  'window':'Imagens/sebas-mama.png.png',
  'clue':'Imagens/sebas-mama.png.png',
  'book':'Imagens/sebas-mama.png.png'
};
function sceneIllustration(kind){const src=illustrations[kind]||illustrations.cover;return `<img class="scene-illustration ${kind==='cover'?'cover-art':''}" src="${src}" alt="${kind==='cover'?'Illustrated mystery story cover':'Illustrated scene from the mystery story'}" onerror="this.outerHTML=artwork('${kind}')">`;}
function go(id){if(!scenes[id])return;path.push(id);const s=scenes[id];if(s.ending&&!found.includes(s.ending))found.push(s.ending);persist();render();window.scrollTo({top:0,behavior:"instant"})}
function render(){const id=path[path.length-1],s=scenes[id];$("art").innerHTML=sceneIllustration(s.art||"cover");$("tag").textContent=s.type==="intro"?s.tag:s.type==="ending"?"MYSTERY SOLVED · ENDING "+s.ending:"CHAPTER "+s.n;$("title").textContent=s.title;$("title").tagName;$("subtitle").textContent=s.subtitle||"";$("subtitle").classList.toggle("hidden",!s.subtitle);$("story").innerHTML=s.paragraphs.map(p=>`<p>${safeText(p)}</p>`).join("");$("prompt").textContent=s.question||"";$("prompt").classList.toggle("hidden",!s.question);$("choices").innerHTML="";
(s.options||[]).forEach((o,i)=>{let b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`<span class="num">${i+1}</span><span>${safeText(o.label)}</span><span class="arrow" aria-hidden="true">→</span>`;b.addEventListener("click",()=>go(o.to));$("choices").appendChild(b)});
$("end-extra").innerHTML=s.type==="ending"?`<div class="note">${safeText(s.note)}</div><div class="collection"><strong>Your ending collection: ${found.length} of 4</strong><div class="ending-grid">${[1,2,3,4].map(n=>`<span class="token ${found.includes(n)?'':'lock'}">${found.includes(n)?'✦ Ending '+n:'🔒 Ending '+n}</span>`).join('')}</div><div class="hint">Can you discover all four endings? Go back and try a different path.</div></div>`:"";
$("actions").innerHTML="";if(s.type==="ending"){addAction("↻ Explore another path",()=>{path=["intro"];persist();render()},false);addAction("← Back a elegir",back,true)}
$("back").hidden=path.length<=1;$("progress").classList.toggle("hidden",s.type==="intro");$("chapter").textContent=s.type==="ending"?"You reached an ending!":"Chapter "+(s.n||1);$("progress-text").textContent=s.type==="ending"?`${found.length} of 4 endings discovered`:"Follow the clues";$("progress-fill").style.width=(s.type==="ending"?100:Math.min(94,(s.n||1)/6*100))+"%"}
function addAction(label,fn,secondary){let b=document.createElement("button");b.type="button";b.className="action"+(secondary?" secondary":"");b.textContent=label;b.addEventListener("click",fn);$("actions").appendChild(b)}
function back(){if(path.length>1){path.pop();persist();render();window.scrollTo({top:0,behavior:"instant"})}}
$("back").addEventListener("click",back);$("home").addEventListener("click",()=>{path=["intro"];persist();render();window.scrollTo({top:0,behavior:"instant"})});$("restart").addEventListener("click",()=>{if(confirm("Start over? You will keep the endings you have discovered.")){path=["intro"];persist();render();window.scrollTo({top:0,behavior:"instant"})}});
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement?.tagName))return;if(!/^[1-3]$/.test(e.key))return;const b=$("choices").children[Number(e.key)-1];if(b)b.click()});render();
</script>
